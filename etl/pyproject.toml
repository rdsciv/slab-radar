[project]
name = "slab-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy==0.1.5",
    "polars>=1.30",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
]

[project.scripts]
slab-radar = "slab_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slab_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
